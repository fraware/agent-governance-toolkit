name: effect-grounded-native-acs

on:
  pull_request:
    paths:
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_boundary.py'
      - 'policy-engine/scripts/effect_grounded_native_gate.py'
      - '.github/workflows/effect-grounded-native-acs.yml'
  push:
    branches:
      - research/effect-grounded-acs-conformance-20261020
    paths:
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_boundary.py'
      - 'policy-engine/scripts/effect_grounded_native_gate.py'
      - '.github/workflows/effect-grounded-native-acs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effect-grounded-acs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-acs:
    name: Rust-backed ACS conformance (no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Install native ACS Python SDK
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install maturin==1.8.7
          python -m pip install --no-build-isolation ./sdk/python
      - name: Mandatory native ACS conformance
        run: python scripts/effect_grounded_native_gate.py
