name: effect-grounded-acs-action-binding

on:
  pull_request:
    paths:
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_action_binding.py'
      - 'policy-engine/scripts/effect_grounded_action_binding_gate.py'
      - '.github/workflows/effect-grounded-acs-action-binding.yml'
  push:
    branches:
      - research/native-acs-action-binding-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-binding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-binding:
    name: ACS normalized-input/action binding (no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Build real ACS SDK and crypto dependency
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install maturin==1.8.7
          python -m pip install --no-build-isolation ./sdk/python
          python -m pip install cryptography==46.0.7
      - name: Mandatory 12-case action-binding gate
        run: python scripts/effect_grounded_action_binding_gate.py
