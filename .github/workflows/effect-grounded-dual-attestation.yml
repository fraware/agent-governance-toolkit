name: effect-grounded-dual-attestation

on:
  pull_request:
    paths:
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_dual_attestation.py'
      - 'policy-engine/scripts/effect_grounded_dual_attestation_gate.py'
      - '.github/workflows/effect-grounded-dual-attestation.yml'
  push:
    branches:
      - research/acs-dual-attestation-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-attestation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-policy-and-target:
    name: Native ACS policy signature plus target grant (no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Build native ACS and Ed25519 dependency
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install maturin==1.8.7
          python -m pip install --no-build-isolation ./sdk/python
          python -m pip install cryptography==46.0.7
      - name: Mandatory dual-attestation gate
        run: python scripts/effect_grounded_dual_attestation_gate.py
