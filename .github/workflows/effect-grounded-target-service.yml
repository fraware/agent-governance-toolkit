name: effect-grounded-target-service

on:
  pull_request:
    paths:
      - 'policy-engine/research/effect_target_protocol.py'
      - 'policy-engine/research/conformance/**'
      - 'policy-engine/research/test_effect_target_vectors.py'
      - 'policy-engine/research/test_effect_target_protocol.py'
      - 'policy-engine/research/verify_target_observation.py'
      - 'policy-engine/research/verify-target-observation.md'
      - 'policy-engine/research/test_verify_target_observation.py'
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_target_service.py'
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_signed_target.py'
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_dual_attestation.py'
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_provisioned_identity.py'
      - 'policy-engine/scripts/effect_grounded_target_service_gate.py'
      - 'policy-engine/scripts/effect_grounded_linux_uid_gate.py'
      - '.github/workflows/effect-grounded-target-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effect-target-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-node-vector-verification:
    name: Independent Node.js receipt verifier (built-in crypto only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Cross-language fixed signed vector conformance
        run: node --test research/conformance/verify_target_vectors.test.mjs

  offline-evidence-verification:
    name: Offline signed evidence verifier (no ACS SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install verifier-only dependency
        run: python -m pip install cryptography==46.0.7
      - name: Signed snapshot protocol tests
        run: python -m unittest discover -s research -p 'test_effect_target_protocol.py' -v
      - name: External-key-pin offline verifier tests
        run: python -m unittest discover -s research -p 'test_verify_target_observation.py' -v
      - name: Frozen signed receipt conformance vectors
        run: python -m unittest discover -s research -p 'test_effect_target_vectors.py' -v

  signed-target-observation:
    name: Native ACS / process target with signed snapshot oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Install native ACS and Ed25519 dependency
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install maturin==1.8.7
          python -m pip install --no-build-isolation ./sdk/python
          python -m pip install cryptography==46.0.7
      - name: Mandatory process-boundary effect evidence conformance
        run: python scripts/effect_grounded_target_service_gate.py
      - name: Distinct Linux UID protected-target conformance
        run: sudo -n "$(command -v python)" scripts/effect_grounded_linux_uid_gate.py
