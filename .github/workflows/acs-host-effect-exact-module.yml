name: acs-host-effect-exact-module

on:
  pull_request:
    paths:
      - '.github/workflows/acs-host-effect-exact-module.yml'
      - 'policy-engine/sdk/python/tests/test_host_committed_effect_boundary.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-native-host-effect-tests:
    name: Exact four host-committed-effect tests (zero skips)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Install native ACS Python SDK
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install maturin==1.8.7 pytest==9.0.3
          python -m pip install --no-build-isolation ./sdk/python
      - name: Require compiled native ACS extension
        run: |
          python - <<'PY'
          import importlib.machinery
          from agent_control_specification import _native
          path = getattr(_native, "__file__", "")
          assert isinstance(path, str) and any(
              path.endswith(suffix) for suffix in importlib.machinery.EXTENSION_SUFFIXES
          ), "native compiled ACS extension is mandatory"
          print("COMPILED_NATIVE_ACS_CONFIRMED")
          PY
      - name: Execute precisely the submitted host-effect test file
        run: |
          python -m pytest -v             sdk/python/tests/test_host_committed_effect_boundary.py             --junitxml="$RUNNER_TEMP/exact_host_effect.xml"
      - name: Assert exactly four cases and zero failures, errors or skips
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          path = Path(os.environ["RUNNER_TEMP"]) / "exact_host_effect.xml"
          tree = ElementTree.parse(path)
          suites = tree.getroot()
          if suites.tag == "testsuite":
              suites = [suites]
          else:
              suites = list(suites.findall("testsuite"))
          counts = {field: sum(int(s.get(field, "0")) for s in suites)
                    for field in ("tests", "failures", "errors", "skipped")}
          if counts != {"tests": 4, "failures": 0, "errors": 0, "skipped": 0}:
              raise SystemExit(f"EXACT_HOST_EFFECT_FAILED: {counts}")
          print("EXACT_HOST_EFFECT_PASSED: 4 tests, 0 skipped")
          PY
