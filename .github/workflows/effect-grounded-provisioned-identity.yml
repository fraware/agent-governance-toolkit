name: effect-grounded-provisioned-identity

on:
  pull_request:
    paths:
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_provisioned_identity.py'
      - 'policy-engine/sdk/python/tests/test_effect_grounded_native_dual_attestation.py'
      - 'policy-engine/scripts/effect_grounded_provisioned_identity_gate.py'
      - '.github/workflows/effect-grounded-provisioned-identity.yml'
  push:
    branches:
      - research/acs-provisioned-identity-20261020
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provisioned-identity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provisioned-identity:
    name: Native ACS with provisioned keys and workload credentials
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policy-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Install Rust-backed ACS and Ed25519 implementation
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install maturin==1.8.7
          python -m pip install --no-build-isolation ./sdk/python
          python -m pip install cryptography==46.0.7
      - name: Mandatory workload-identity conformance
        run: python scripts/effect_grounded_provisioned_identity_gate.py
      - name: Mandatory inherited two-signature regression
        run: python scripts/effect_grounded_dual_attestation_gate.py
